<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saisie manuelle de l'adresse</title>

    <link rel="stylesheet" href="saisieAdresse.css" />
    <script src="saisieAdresse.js" defer></script>
  </head>
  <body>
    <h1>Votre adresse n'a pas été trouvée</h1>
    <p class="intro">
      Entrez-la champ par champ. Les autres informations de votre formulaire
      sont conservées.
    </p>

    <form id="formAdresse" novalidate>
      <div>
        <label for="numero">Numéro civique</label>
        <input id="numero" name="numero" required />
        <div class="exemple">ex. 125</div>
      </div>
      <div>
        <label for="rue">Rue</label>
        <input id="rue" name="rue" required />
        <div class="exemple">ex. rue Saint-Benoît</div>
      </div>
      <div>
        <label for="ville">Ville</label>
        <input id="ville" name="ville" required />
        <div class="exemple">ex. Amqui</div>
      </div>
      <div>
        <label for="province">Province</label>
        <select id="province" name="province" required>
          <option value="">Choisir…</option>
          <option value="QC">Québec</option>
          <option value="ON">Ontario</option>
          <option value="NB">Nouveau-Brunswick</option>
          <option value="NS">Nouvelle-Écosse</option>
          <option value="PE">Île-du-Prince-Édouard</option>
          <option value="NL">Terre-Neuve-et-Labrador</option>
          <option value="MB">Manitoba</option>
          <option value="SK">Saskatchewan</option>
          <option value="AB">Alberta</option>
          <option value="BC">Colombie-Britannique</option>
          <option value="YT">Yukon</option>
          <option value="NT">Territoires du Nord-Ouest</option>
          <option value="NU">Nunavut</option>
        </select>
        <div class="exemple">ex. Québec</div>
      </div>
      <div>
        <label for="codePostal">Code postal</label>
        <input
          id="codePostal"
          name="codePostal"
          required
          maxlength="7"
          autocomplete="postal-code"
          pattern="[A-Za-z][0-9][A-Za-z][ \-]?[0-9][A-Za-z][0-9]"
          title="Format : lettre, chiffre, lettre, puis chiffre, lettre, chiffre (ex. G5J 1A1)"
        />
        <div class="exemple">ex. G5J 1A1</div>
      </div>
      <div>
        <label for="pays">Pays</label>
        <input id="pays" name="pays" value="Canada" required />
        <div class="exemple">ex. Canada</div>
      </div>

        <p id="messageErreur" class="message-erreur pleine-largeur" role="alert" hidden></p>
    
      <div class="boutons pleine-largeur">
        <button type="button" class="secondaire" id="annuler">Annuler</button>
        <button type="submit" class="principal">Confirmer l'adresse</button>
      </div>
    </form>
  </body>
</html>
